<meta name="apple-mobile-web-app-title" content="Perfumes">
<title>Avaliador de Perfumes</title>
<style>
:root{color-scheme:dark;--bg:#1e1f21;--card:#292a2d;--ink:#ecebe7;--mute:#9a9a9f;--line:#3b3c40;--accent:#d9d4c7;--star:#d6b36a;--on:#1e1f21;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Josefin Sans","Avenir Next",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:34px;margin:8px 0 4px;font-weight:300;letter-spacing:.02em}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
button,input,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--on);border:0;border-radius:4px;padding:12px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:12px}
label,.lb{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:16px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;margin-top:16px}
.row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:7px 14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.stars{display:inline-flex;font-size:30px;line-height:1}
.s{position:relative;display:inline-block;width:1em;color:var(--line)}
.s .f{position:absolute;left:0;top:0;overflow:hidden;color:var(--star);white-space:nowrap}
.s b{position:absolute;top:0;height:100%;width:50%;cursor:pointer;font-size:0}
.s b:first-of-type{left:0}.s b:last-of-type{right:0}
.small .stars{font-size:18px}
.photo{width:96px;height:96px;border-radius:4px;object-fit:cover;background:var(--bg);border:1px solid var(--line);display:block}
.pv{display:flex;gap:12px;align-items:center}
.item{display:flex;gap:12px}
.item img,.item .ph{width:72px;height:72px;border-radius:4px;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--line)}
.item .ph{display:flex;align-items:center;justify-content:center;font-size:28px}
.body{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:20px;font-weight:600;margin:0}
.brand,.perf{color:var(--mute);font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 10px}
.notes{margin:10px 0 0;white-space:pre-wrap}
.acts{display:flex;gap:16px;margin-top:12px;font-size:14px}
.acts button{background:none;border:0;color:var(--accent);padding:0;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:32px 8px;font-family:system-ui,sans-serif}
.tip{color:var(--mute);font-size:13px;margin-top:24px}
:focus-visible{outline:2px solid var(--star);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Avaliador de perfumes</h1>
<p class="sub" id="count"></p>
<div id="formBox"></div>
<div id="list"></div>
<p class="tip">Dica: no iPhone, toque em Compartilhar e depois em “Adicionar à Tela de Início” para usar como app.</p>
</main>
<script>
var KEY="perfumes-v1",items=[],editing=null,draft=null;
var TAGS=["Dia","Noite","Calor","Frio"],FIX=["Fraca","Média","Boa"],PROJ=["Discreta","Moderada","Forte"];
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert("Não foi possível salvar: o armazenamento do navegador está cheio.")}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stars(v,input){
  var h='<span class="stars" aria-label="Nota '+v+' de 5">';
  for(var i=1;i<=5;i++){
    var w=v>=i?100:(v>=i-0.5?50:0);
    h+='<span class="s">★<span class="f" style="width:'+w+'%">★</span>'+
      (input?'<b data-v="'+(i-0.5)+'" role="button" aria-label="'+(i-0.5)+' estrelas">.</b><b data-v="'+i+'" role="button" aria-label="'+i+' estrelas">.</b>':'')+'</span>';
  }
  return h+'</span>';
}
function chips(list,key,sel){
  return '<div class="chips">'+list.map(function(x){
    var on=Array.isArray(sel)?sel.indexOf(x)>-1:sel===x;
    return '<button type="button" class="chip'+(on?' on':'')+'" data-k="'+key+'" data-x="'+x+'" aria-pressed="'+on+'">'+x+'</button>'}).join("")+'</div>';
}
function renderForm(){
  var box=document.getElementById("formBox");
  if(!draft){box.innerHTML='<button class="btn" id="new" style="width:100%;margin-bottom:16px">Novo perfume</button>';
    document.getElementById("new").onclick=function(){editing=null;draft={name:"",brand:"",rating:0,notes:"",tags:[],fix:"",proj:"",photo:""};renderForm()};return}
  box.innerHTML='<div class="card" id="fm"><label for="n">Nome</label><input type="text" id="n" value="'+esc(draft.name)+'">'+
  '<label for="b">Marca</label><input type="text" id="b" value="'+esc(draft.brand)+'">'+
  '<div class="lb">Foto do frasco</div><div class="pv">'+(draft.photo?'<img class="photo" alt="Foto do frasco" src="'+draft.photo+'">':'')+
  '<div><label class="btn ghost" style="margin:0;display:inline-block;color:var(--accent)">'+(draft.photo?'Trocar foto':'Adicionar foto')+'<input type="file" id="ph" accept="image/*" hidden></label>'+
  (draft.photo?' <button type="button" class="chip" data-k="rmphoto">Remover</button>':'')+'</div></div>'+
  '<div class="lb">Ocasião</div>'+chips(TAGS,"tags",draft.tags)+
  '<div class="lb">Fixação</div>'+chips(FIX,"fix",draft.fix)+
  '<div class="lb">Projeção</div>'+chips(PROJ,"proj",draft.proj)+
  '<div class="lb">Nota (toque na metade ou na estrela inteira)</div><div id="st">'+stars(draft.rating,true)+'</div>'+
  '<label for="o">Observações</label><textarea id="o">'+esc(draft.notes)+'</textarea>'+
  '<div class="row"><button class="btn ghost" id="cancel">Cancelar</button><button class="btn" id="ok">Salvar</button></div></div>';
  document.getElementById("ph").onchange=function(e){var f=e.target.files[0];if(!f)return;sync();
    var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
      var m=480,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      draft.photo=c.toDataURL("image/jpeg",0.7);renderForm()};im.src=r.result};r.readAsDataURL(f)};
  document.getElementById("fm").onclick=function(e){var t=e.target,v=t.getAttribute&&t.getAttribute("data-v"),k=t.getAttribute&&t.getAttribute("data-k");
    if(v){sync();draft.rating=parseFloat(v);renderForm();return}
    if(!k)return;sync();var x=t.getAttribute("data-x");
    if(k==="tags"){var i=draft.tags.indexOf(x);if(i>-1)draft.tags.splice(i,1);else draft.tags.push(x)}
    else if(k==="rmphoto"){draft.photo=""}
    else{draft[k]=draft[k]===x?"":x}
    renderForm()};
  document.getElementById("cancel").onclick=function(){draft=null;renderForm()};
  document.getElementById("ok").onclick=function(){sync();
    if(!draft.name.trim()){document.getElementById("n").focus();return}
    if(editing===null){draft.id=Date.now();items.unshift(draft)}else{items[editing]=draft}
    save();draft=null;renderForm();renderList()};
}
function sync(){draft.name=document.getElementById("n").value;draft.brand=document.getElementById("b").value;draft.notes=document.getElementById("o").value}
function renderList(){
  document.getElementById("count").textContent=items.length?items.length+(items.length==1?" perfume registrado":" perfumes registrados"):"";
  var l=document.getElementById("list");
  if(!items.length){l.innerHTML='<div class="empty">Nenhum perfume ainda. Toque em “Novo perfume” para começar.</div>';return}
  l.innerHTML=items.map(function(p,i){
    var perf=[p.fix?"Fixação "+p.fix.toLowerCase():"",p.proj?"Projeção "+p.proj.toLowerCase():""].filter(Boolean).join(" · ");
    return '<div class="card small"><div class="item">'+(p.photo?'<img alt="" src="'+p.photo+'">':'<div class="ph">🧴</div>')+
    '<div class="body"><div class="top"><div><p class="name">'+esc(p.name)+'</p><div class="brand">'+esc(p.brand||"")+'</div></div>'+stars(p.rating,false)+'</div>'+
    ((p.tags&&p.tags.length)?'<div class="pills">'+p.tags.map(function(t){return '<span class="pill">'+t+'</span>'}).join("")+'</div>':'')+
    (perf?'<div class="perf" style="margin-top:6px">'+perf+'</div>':'')+'</div></div>'+
    (p.notes?'<p class="notes">'+esc(p.notes)+'</p>':'')+
    '<div class="acts"><button data-e="'+i+'">Editar</button><button data-d="'+i+'">Excluir</button></div></div>'}).join("");
}
document.getElementById("list").onclick=function(e){
  var t=e.target,ed=t.getAttribute("data-e"),de=t.getAttribute("data-d");
  if(ed!==null){editing=+ed;draft=JSON.parse(JSON.stringify(items[editing]));draft.tags=draft.tags||[];draft.fix=draft.fix||"";draft.proj=draft.proj||"";draft.photo=draft.photo||"";renderForm();window.scrollTo(0,0)}
  if(de!==null&&confirm("Excluir este perfume?")){items.splice(+de,1);save();renderList()}
};
renderForm();renderList();
</script>
</body>
</html>
